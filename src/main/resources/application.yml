spring:
  application:
    name: ledgervoice
  datasource:
    url: ${LEDGER_DB_URL:jdbc:h2:file:./var/ledgervoice;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    org.springframework.ai: ERROR
    com.openai: ERROR
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-no-correlation}] %logger{36} - %msg%n"
